<template>
    <lightning-card title = "Quiz App in LWC">
        <div class = "slds-var-m-around_medium">
            <form>
                <template for:each={myQuestions} for:item="quiz">
                <div key = {quiz.id}>
                    <div><strong>{quiz.id} - {quiz.question}</strong></div>
                    <!-- Grid -->
                    <div class="slds-grid slds-var-m-around_medium"> 
                    <!-- Space btw ques and ans : slds-col slds-var-m-around_medium -->
                        <div class="slds-col">
                            <!-- Radio Button  -->
                            <input type = "radio" name = {quiz.id} value = "a" onchange = {changeHandler}/>
                            {quiz.answers.a}
                        </div>
                        <div class="slds-col">
                            <input type = "radio" name = {quiz.id} value = "b" onchange = {changeHandler}/>
                            {quiz.answers.b}
                        </div>
                        <div class="slds-col">
                            <input type = "radio" name = {quiz.id} value = "c" onchange = {changeHandler}/>
                            {quiz.answers.c}
                        </div>
                    </div>
                </div>
                </template>
                <lightning-button
                    variant="brand"
                    type="Submit"
                    label="Submit" 
                    title="Submit Quiz" 
                    onclick={submitHandler} 
                    disabled = {allNotSelected}
                    class="slds-m-left_x-small">
                </lightning-button>
                    <lightning-button
                        variant="brand"
                        type="Submit" 
                        label="Reset" 
                        title="Reset Quiz" 
                        onclick={resetHandler} 
                        class="slds-m-left_x-small">
                    </lightning-button>
            </form>
            <template lwc:if = {isSubmitted}>
                <div class = {isScoredFull}>You have Scored {correctAnswers} out of {myQuestions.length}</div>
            </template>
        </div>
    </lightning-card>
</template>
