<template>
    <lightning-card title="Get Picklist Values By Record Type Demo">
        <div class="slds-m-around_medium">
            <lightning-combobox
            name="rating"
            label="Rating"
            value={selectedRating}
            placeholder="Select Rating"
            options={ratingOptions}
            onchange={handleRatingChange} ></lightning-combobox>

    <p>Selected value is: {selectedRating}</p>

    <lightning-combobox
            name="industry"
            label="Industry"
            value={selectedIndustry}
            placeholder="Select Industry"
            options={industryOptions}
            onchange={handleIndustryChange} ></lightning-combobox>

    <p>Selected value is: {selectedIndustry}</p>
        </div>
    </lightning-card>
</template>
