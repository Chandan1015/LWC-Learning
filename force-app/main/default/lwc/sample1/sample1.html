<template>
    <lightning-card  title="LWC Component">
        <div class="slds-m-around_medium">
            <lightning-icon 
                icon-name="utility:user"
                size="medium"
                alternative-text="User Icon">
            </lightning-icon>

            <lightning-input 
                label="Name"
                type="text"
                value={name}
                onchange={nameChangeHandler}>
            </lightning-input>

            <lightning-input
                label="Age"
                type="number"
                value={age}
                onchange={ageChangeHandler}>
            </lightning-input>
            
            <lightning-input
                label="Email"
                type="email"
                value={email}
                onchange={emailChangeHandler}>
            </lightning-input>

            <lightning-input
                type="checkbox"
                label="Active"
                checked={isActive}
                onchange={activeChangeHandler}>
            </lightning-input>

            <lightning-radio-group 
                label="Gender"
                options={genderOptions}
                value={gender}
                onchange={genderChangeHandler}>
            </lightning-radio-group>

            <lightning-combobox
                label="Country"
                value={country}
                options={countryOptions}
                onchange={countryChangeHandler}>
            </lightning-combobox>

            <lightning-textarea
                label="Address"
                value={address}
                onchange={addressChangeHandler}>
            </lightning-textarea>

            <lightning-button
                label="Submit"
                variant="brand"
                onclick={submitHandler}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>

</template>
