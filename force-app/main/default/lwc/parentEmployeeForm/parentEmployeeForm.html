<template>
    <lightning-card  title="Employee Form">
        <div class="slds-m-around_medium">
            
            <lightning-button
                label="Create New"
                variant="brand"
                onclick={createNewHandler}>
            </lightning-button>
        </div>
            <template if:true={showForm}>
                <div class="slds-m-around_medium">
                    <c-child1-account-form onaccountchange={handleAccountData}>  
                    </c-child1-account-form>

                    <c-child2-contact-form oncontactchange={handleContactData}>  
                    </c-child2-contact-form>

                    <c-child3-other-info onotherchange={handleOtherData}>  
                    </c-child3-other-info>

                    <lightning-button
                        label="Submit"
                        variant="brand"
                        onclick={submitHandler}
                        class="slds-m-top_medium">
                    </lightning-button> 
                </div>
            </template>
    </lightning-card>
</template>
