<template>
    
    <lightning-card  title="2 Way Data Binding">
        <div class="slds-m-around_medium">
            <lightning-input 
            type="text" 
            label="Enter Course Name" 
            onkeyup={changeHandler}>
        </lightning-input>
        <div> {fullname} is a course of {title}</div>
        </div>
    </lightning-card>

    <lightning-card  title="@track Properties">
        <div class="slds-m-around_medium">
            <lightning-input 
            type="text" 
            label="Enter City Name" 
            onkeyup={trackHandler}>
        </lightning-input>
        <div>{address.city} is my city</div>
        </div>
    </lightning-card>

    <lightning-card  title="Getters">
        <div class="slds-m-around_medium">
        <div>First User name is {firstUser}</div>
        <div>Sum of {n1} and {n2} is {sum}</div>
        </div>
    </lightning-card>

    <lightning-card  title="Conditional rendering">
        <div class="slds-m-around_medium">
            <lightning-button 
                variant="brand" 
                label="Show Data" 
                title="Show data" 
                onclick={handleClick} 
                class="slds-m-left_x-small">
            </lightning-button>
            <template if:true = {isVisible}>
                <div>Welcome to LWC </div>
            </template>
            <template if:false = {isVisible}>
                <div>You can't see the data. Please click the buttion</div>
            </template>
        </div>
        <div class="slds-m-around_medium">
            <lightning-input 
            type="text" 
            label="Type Hello to see the data" 
            onkeyup={changeHandler}>
        </lightning-input>
        <template if:true = {helloMethod}>
            <div>You have typed correctly</div>
        </template>
        </div>
    </lightning-card>
</template>
